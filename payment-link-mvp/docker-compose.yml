version: '3.8'

services:
  # Gin后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payment_link_backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=epusdt
      - DB_PASSWORD=epusdt123456
      - DB_NAME=epusdt
      - JWT_SECRET=your-secret-key-change-in-production
      - EPUSDT_BASE_URL=http://epusdt-app:8000
      - EPUSDT_AUTH_TOKEN=epusdt_password_xasddawqe
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - payment_network
      - epusdt-network

  # React前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payment_link_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - payment_network

networks:
  payment_network:
    driver: bridge
  epusdt-network:
    external: true
