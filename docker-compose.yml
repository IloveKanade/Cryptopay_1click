version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: epusdt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: epusdt123456
      MYSQL_DATABASE: epusdt
      MYSQL_USER: epusdt
      MYSQL_PASSWORD: epusdt123456
    command: --lower-case-table-names=2 --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - ./epusdt/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - epusdt-network
      - payment-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: epusdt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./epusdt/data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - epusdt-network
      - payment-network

  epusdt:
    build: ./epusdt
    container_name: epusdt
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=epusdt123456
      - MYSQL_DATABASE=epusdt
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./epusdt/logs:/app/logs
      - ./epusdt/runtime:/app/runtime
      - ./epusdt/.env:/app/.env
    networks:
      - epusdt-network
      - payment-network

  # 后端服务
  backend:
    build:
      context: ./payment-link-mvp/backend
      dockerfile: Dockerfile
    container_name: payment-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=epusdt
      - DB_PASSWORD=epusdt123456
      - DB_NAME=epusdt
      - JWT_SECRET=your-secret-key-change-in-production
      - EPUSDT_BASE_URL=http://epusdt:8000
      - EPUSDT_AUTH_TOKEN=epusdt_password_xasddawqe
    depends_on:
      mysql:
        condition: service_healthy
      epusdt:
        condition: service_started
    networks:
      - epusdt-network
      - payment-network

  # 前端服务
  frontend:
    build:
      context: ./payment-link-mvp/frontend
      dockerfile: Dockerfile
    container_name: payment-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - payment-network

networks:
  epusdt-network:
    driver: bridge
  payment-network:
    driver: bridge
